name: github-actions-workflow.yml
run-name: ${{ github.actor }} launch GitHub Actions 🚀
on:
  push:
    branches:
      - main
      - develop
  pull_request:
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Project checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Format code verify
        run: npm run format:check

      - name: Quality code verify
        run: npm run lint

      - name: Verify code typescript is valid
        run: npm run typecheck
  unit-test:
    runs-on: ubuntu-latest
    needs: init
    steps:
      - name: Project checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Verify unit test with coverage is successfull
        run: npm run test

      - name: Clean coverage folder
        run: rm -rf coverage
  build:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Project checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci
      - name: Build project
        run: npm run build

      - name: Clean build project folder
        run: rm -rf dist
